models:
- name: stg_stripe__payment
  description: This model provides a detailed view of payment transactions processed
    through Stripe. It includes information about the payment method, status, and
    amount, as well as timestamps for when the payment was created. This model is
    useful for analyzing payment trends and statuses.
  columns:
  - name: payment_id
    description: A unique identifier for each payment transaction.
  - name: order_id
    description: The identifier for the order associated with the payment.
  - name: payment_method
    description: The method used to process the payment, such as credit card or bank
      transfer.
  - name: status
    description: The current status of the payment, indicating whether it is completed,
      pending, or failed.
  - name: amount
    description: The total amount of the payment transaction.
    tests:
    - dbt_expectations.expect_table_column_count_to_be_between:
        arguments:
          min_value: 1 # (Optional)
          stricly: false
  - name: created_at
    description: The date when the payment was created.
